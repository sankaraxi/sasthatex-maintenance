        /* Industrial metallic grid & subtle diamond-plate texture */
        .industrial-bg {
            background-color: #121417;

                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),

            background-position: 0 0, 0 0, 0 0, 8px 8px;

        /* Caution hazard stripe bar */

                -45deg,

                #F59E0B 10px,
                #121417 10px,
                #121417 20px

        }

        /* Interlocking gear & precision drill bit animations */
        @keyframes spinClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinCounterClockwise {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.25)); }
            50% { filter: drop-shadow(0 0 14px rgba(245, 158, 11, 0.55)); }
        }

        .gear-cw {
            transform-origin: 28px 28px;
            animation: spinClockwise 10s linear infinite;
        }

        .gear-ccw {
            transform-origin: 54px 44px;
            animation: spinCounterClockwise 7s linear infinite;
        }

    <!-- Live Countdown Script targeting Tuesday, 24 Nov 2026 at 09:00:00 IST -->
    <script>
        (function () {
            // Target date: Tuesday, November 24, 2026 at 09:00:00 PM IST (+05:30)
            const targetDate = new Date('2026-11-24T21:00:00+05:30').getTime();

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const containerEl = document.getElementById('countdown-container');

            function padZero(num) {
                return num < 10 ? '0' + num : String(num);
            }

            function updateCountdown() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance <= 0) {
                    if (containerEl) {
                        containerEl.innerHTML = '<div class="col-span-4 py-2 font-mono text-sm font-semibold text-safety-400">SYSTEMS ONLINE — RELOADING CATALOG...</div>';
                    }
                    clearInterval(timerInterval);
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if (daysEl) daysEl.textContent = padZero(days);
                if (hoursEl) hoursEl.textContent = padZero(hours);
                if (minutesEl) minutesEl.textContent = padZero(minutes);
                if (secondsEl) secondsEl.textContent = padZero(seconds);
            }

            updateCountdown();
            const timerInterval = setInterval(updateCountdown, 1000);
        })();
    </script>
